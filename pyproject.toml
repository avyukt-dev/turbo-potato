[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-ai-social-manager"
version = "0.1.0"
description = "Evidence-first AI newsroom and social publishing system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
newsctl = "news_ai_common.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api", "packages/common"]
include = ["news_ai_api*", "news_ai_common*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/common"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
