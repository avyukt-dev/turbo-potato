schema_version: 1
stage_id: quality-checking
task_type: QUALITY_CHECKING
prompt:
  prompt_id: content-quality
  version: v5
  path: prompts/quality/v5.txt
providers:
  - provider_id: groq
    model: openai/gpt-oss-120b
  - provider_id: local-llama
    model: local-news-ai
fallback_on: [INVALID_RESPONSE, TIMEOUT, RATE_LIMIT, UNAVAILABLE]
request_defaults:
  reasoning_effort: medium
  max_tokens: 4096
  rate_limit_retry_delays_seconds: [5, 15, 30]
