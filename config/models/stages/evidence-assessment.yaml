schema_version: 1
stage_id: evidence-assessment
task_type: EVIDENCE_ASSESSMENT
prompt:
  prompt_id: evidence-assessment
  version: v2
  path: prompts/evidence-assessment/v2.txt
providers:
  - provider_id: groq
    model: openai/gpt-oss-120b
  - provider_id: local-llama
