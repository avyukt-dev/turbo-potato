schema_version: 1
services:
  # The API is a critical request boundary; scheduler/publisher downtime delays
  # publication but preserves durable work, so those services are non-critical.
  - {name: news-api, native_name: news-api, service_class: application, manageable: true, critical: true, expected: true}
  - {name: news-pipeline, native_name: news-pipeline, service_class: application, manageable: true, critical: true, expected: true}
  - {name: news-scheduler, native_name: news-scheduler, service_class: application, manageable: true, expected: true}
  - {name: news-publisher, native_name: news-publisher, service_class: application, manageable: true, expected: true}
  # Logical upstream stages are owned by news-pipeline, not separate host services.
  - {name: news-collector, native_name: news-collector, service_class: application}
  - {name: news-processor, native_name: news-processor, service_class: application}
  - {name: news-ai-worker, native_name: news-ai-worker, service_class: application}
  - {name: news-research-worker, native_name: news-research-worker, service_class: application}
  - {name: postgres, native_name: postgresql, service_class: infrastructure, manageable: true, critical: true, expected: true}
  - {name: redis, native_name: redis, service_class: infrastructure, manageable: true, critical: true, expected: true}
  - {name: llama, native_name: llama, service_class: infrastructure, manageable: true}
